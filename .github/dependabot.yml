version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
    open-pull-requests-limit: 3
    groups:
      frontend-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /tests/browser
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    open-pull-requests-limit: 2
    groups:
      browser-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
