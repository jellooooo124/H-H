name: Refresh locked dependencies

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 1 * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-dependency-locks
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.in
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/browser/package-lock.json
      - name: Refresh hashed Python runtime and test locks
        run: |
          python -m pip install --disable-pip-version-check pip-tools
          pip-compile --upgrade --generate-hashes --resolver=backtracking --output-file=backend/requirements.lock backend/requirements.txt
          pip-compile --upgrade --generate-hashes --resolver=backtracking --output-file=backend/requirements-dev.lock backend/requirements-dev.in
      - name: Refresh npm lockfiles without install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - name: Refresh browser-test npm lockfile without install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
        working-directory: tests/browser
      - name: Open a review PR for refreshed lockfiles
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/refresh-dependency-locks
          delete-branch: true
          title: "chore: refresh locked dependencies"
          commit-message: "chore: refresh locked dependencies"
          body: |
            Automated dependency lock refresh. Review the dependency changes and security advisories.
            The full CI suite must pass before merge.
          add-paths: |
            backend/requirements.lock
            backend/requirements-dev.lock
            frontend/package-lock.json
            tests/browser/package-lock.json
