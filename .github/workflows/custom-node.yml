name: H@H custom node contract and runtime
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  custom-node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/n8n-nodes-hah/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: pip install --require-hashes -r backend/requirements-dev.lock
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: packages/n8n-nodes-hah
      - run: npm test
        working-directory: packages/n8n-nodes-hah
      - run: npm run test:integration
        working-directory: packages/n8n-nodes-hah
      - run: pytest -q tests/test_custom_node_contract.py
      - name: Load and execute examples in real n8n with disposable credentials
        run: python packages/n8n-nodes-hah/tests/runtime_smoke.py
