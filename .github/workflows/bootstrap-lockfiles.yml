name: Bootstrap reproducible dependency lockfiles

on:
  push:
    branches:
      - chore/generate-dependency-lockfiles

permissions:
  contents: write

concurrency:
  group: dependency-lock-bootstrap
  cancel-in-progress: true

jobs:
  lockfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve Python runtime dependencies into a hashed lockfile
        run: |
          python -m pip install --disable-pip-version-check pip-tools
          pip-compile --generate-hashes --resolver=backtracking --output-file=backend/requirements.lock backend/requirements.txt
          pip-compile --generate-hashes --resolver=backtracking --output-file=backend/requirements-dev.lock backend/requirements-dev.in
      - name: Generate npm lockfiles without running install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - name: Generate browser test npm lockfile without running install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
        working-directory: tests/browser
      - name: Commit lockfiles back to this temporary branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/requirements.lock backend/requirements-dev.lock frontend/package-lock.json tests/browser/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already up to date."
          else
            git commit -m "chore: generate reproducible dependency lockfiles"
            git push origin HEAD:chore/generate-dependency-lockfiles
          fi
