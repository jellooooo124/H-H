name: Bootstrap paired Vite 8 lockfile

on:
  push:
    branches:
      - chore/upgrade-vite8-compatible

permissions:
  contents: write

concurrency:
  group: vite8-lock-bootstrap
  cancel-in-progress: true

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Regenerate frontend lockfile with compatible Vite and Vue plugin versions
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - name: Commit lockfile to this temporary branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
          else
            git commit -m "chore: regenerate compatible Vite 8 lockfile"
            git push origin HEAD:chore/upgrade-vite8-compatible
          fi
