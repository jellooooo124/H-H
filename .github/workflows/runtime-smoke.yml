name: Full stack disposable Docker Compose smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Avoid paying CI minutes twice for obsolete commits on the same branch/PR.
concurrency:
  group: runtime-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Enable BuildKit and GitHub Actions cache
        uses: docker/setup-buildx-action@v4
      - name: Build API image with reusable layer cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          tags: hah-care-api:local
          load: true
          cache-from: type=gha,scope=hah-api
          cache-to: type=gha,mode=max,scope=hah-api
      - name: Build frontend image with reusable layer cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          tags: hah-care-frontend:local
          load: true
          cache-from: type=gha,scope=hah-frontend
          cache-to: type=gha,mode=max,scope=hah-frontend
      - name: Create disposable synthetic-only secrets
        run: |
          python - <<'PY'
          import os, secrets, base64
          values = {
              'APP_INTERNAL_KEY': 'ci-' + secrets.token_hex(32),
              'APP_TOKEN_SECRET': 'ci-' + secrets.token_hex(32),
              'APP_ENCRYPTION_KEY': base64.urlsafe_b64encode(os.urandom(32)).decode(),
              'N8N_ENCRYPTION_KEY': secrets.token_hex(32),
              'POSTGRES_PASSWORD': secrets.token_hex(24),
              'APP_ADMIN_KEY': 'ci-' + secrets.token_hex(32),
              'AUTH_MODE': 'demo',
              'DEMO_MODE': 'true',
          }
          with open('.env','w') as f:
              for k,v in values.items(): f.write(f'{k}={v}\n')
          os.chmod('.env',0o600)
          print('Generated isolated CI-only credentials; values redacted')
          PY
      - name: Build and start database, API, n8n and front end
        run: docker compose up -d
      - name: Wait for all four services
        run: |
          set -euo pipefail
          for attempt in $(seq 1 100); do
            if curl -fsS --max-time 3 http://127.0.0.1:8000/health >/tmp/hah_api_health.json &&
               curl -fsS --max-time 3 http://127.0.0.1:8080/ >/tmp/hah_frontend.html &&
               curl -fsS --max-time 3 http://127.0.0.1:5678/healthz >/tmp/hah_n8n_health.txt; then
              echo "All API, Vue/Nginx, n8n endpoints responded"
              break
            fi
            if [ "$attempt" -eq 100 ]; then
              echo "Timed out waiting for the complete stack" >&2
              exit 1
            fi
            sleep 3
          done
          python - <<'PY'
          import json
          from pathlib import Path
          health=json.loads(Path('/tmp/hah_api_health.json').read_text())
          assert health['ok'] is True, health
          assert health['db_backend']=='postgres', health
          assert health['synthetic_only'] is True, health
          page=Path('/tmp/hah_frontend.html').read_text()
          assert '<html' in page.lower(), 'Front end did not render HTML'
          print('Real PostgreSQL-backed API and Vue frontend: PASS')
          PY
      - name: Verify browser security headers and fail-closed HTTP boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          root="http://127.0.0.1:8080"
          for endpoint in ("/","/patient.html"):
              with urlopen(root+endpoint,timeout=10) as res:
                  hdr=res.headers
                  policy=hdr.get("Content-Security-Policy","")
                  assert "default-src 'self'" in policy,policy
                  assert "script-src 'self'" in policy,policy
                  assert "object-src 'none'" in policy,policy
                  assert "frame-ancestors 'none'" in policy,policy
                  assert hdr.get("X-Frame-Options")=="DENY"
                  assert hdr.get("X-Content-Type-Options")=="nosniff"
                  assert "no-store" in hdr.get("Cache-Control","")
                  assert "camera=()" in hdr.get("Permissions-Policy","")
          for endpoint in ("/v1/cases","/v2/tasks","/v5/patient/communications"):
              try:
                  urlopen(root+endpoint,timeout=10)
              except HTTPError as err:
                  assert err.code==401,(endpoint,err.code)
              else:
                  raise AssertionError(f"{endpoint} unexpectedly public")
          for endpoint in ("/internal/ops/audit-health","/internal/checkin/triage"):
              req=Request(root+endpoint,data=b"{}",method="POST",headers={"Content-Type":"application/json"})
              try:
                  urlopen(req,timeout=10)
              except HTTPError as err:
                  assert err.code==401,(endpoint,err.code)
              else:
                  raise AssertionError(f"{endpoint} unexpectedly public")
          print("PASS: strict CSP/permissions/frame headers, unauthenticated clinician/patient/internal endpoints rejected")
          PY
      - name: Enforce private-host port exposure contract
        run: bash scripts/verify_remote_deployment.sh
      - name: Check HMAC audit chain using authenticated API
        run: |
          set -euo pipefail
          internal_key="$(sed -n 's/^APP_INTERNAL_KEY=//p' .env)"
          curl -fsS --max-time 20 -X POST             -H "X-Internal-Key: ${internal_key}"             -H 'Content-Type: application/json'             -d '{}'             http://127.0.0.1:8000/internal/ops/audit-health > /tmp/hah_db_audit_health.json
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('/tmp/hah_db_audit_health.json').read_text())
          assert result['db_backend']=='postgres', result
          assert result['audit_chain_valid'] is True, result
          assert result['synthetic_only'] is True, result
          print('PostgreSQL/HMAC API integration: PASS')
          PY
      - name: Import all workflows into the running n8n instance
        run: |
          docker compose cp workflows n8n:/tmp/workflows
          docker compose exec -T n8n n8n import:workflow --separate --input=/tmp/workflows
      - name: Execute published n8n check-in webhook with synthetic-only event
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('workflows/05_checkin_safety_route.json').read_text())
          data['id']='ci-checkin-route'
          # Verify that the distributed workflow itself has the registered webhook ID.
          assert data['nodes'][0]['webhookId']=='2c6818b6-e356-45c3-848e-d3e5e52900f7'
          data['name']='CI - Synthetic Webhook Test'
          Path('/tmp/ci_checkin_flow.json').write_text(json.dumps(data))
          PY
          docker compose cp /tmp/ci_checkin_flow.json n8n:/tmp/ci_checkin_flow.json
          docker compose exec -T n8n n8n import:workflow --input=/tmp/ci_checkin_flow.json
          docker compose exec -T n8n n8n publish:workflow --id=ci-checkin-route
          docker compose restart n8n
          for i in $(seq 1 45); do
            if curl -fsS --max-time 3 http://127.0.0.1:5678/healthz >/dev/null; then break; fi
            sleep 2
          done
          # n8n /healthz becomes healthy before published webhooks are registered.
          # Send a non-patient, nonexistent ID solely to confirm the webhook route
          # accepts HTTP; this is not the case under test and creates no check-in.
          ready=""
          for i in $(seq 1 40); do
            ready="$(curl -sS -o /tmp/ci_webhook_ready.json -w '%{http_code}' --max-time 5 -X POST \
              -H 'Content-Type: application/json' \
              -d '{"event_id":"CHK-CI-READINESS_ONLY"}' \
              http://127.0.0.1:5678/webhook/hah-checkin-intake || true)"
            if [ "$ready" = "200" ] || [ "$ready" = "202" ]; then break; fi
            sleep 2
          done
          test "$ready" = "200" || test "$ready" = "202" || { echo "n8n production webhook failed to register" >&2; exit 1; }
          # Exercise the full patient-facing HTTP endpoint; do not manually
          # call the n8n webhook or the FastAPI internal triage endpoint.
          # JWT stays inside the disposable API container and is never printed.
          docker compose exec -T api python - <<'PY'
          import os
          import time
          import uuid
          import jwt
          import httpx
          from app.main import app

          event_id = "CHK-CI-" + uuid.uuid4().hex[:20]
          claims = {
              "iss": "hah-course-demo",
              "sub": "ci-synthetic-patient",
              "role": "patient",
              "patient_ref": "DEMO-P001",
              "exp": int(time.time()) + 300,
          }
          token = jwt.encode(claims, os.environ["APP_TOKEN_SECRET"], algorithm="HS256")
          result = httpx.post(
              "http://127.0.0.1:8000/v2/checkins",
              headers={"Authorization": "Bearer " + token},
              json={
                  "event_id": event_id,
                  "patient_ref": "DEMO-P001",
                  "is_synthetic": True,
                  "symptoms": {"swelling": True},
                  "device_problem": False,
                  "patient_note": "Synthetic CI-only check-in",
              },
              timeout=30,
          )
          assert result.status_code == 202, "Patient check-in API returned " + str(result.status_code)
          assert result.json()["event_id"] == event_id

          for attempt in range(30):
              row = app.state.store.db.execute(
                  "SELECT status FROM checkins WHERE event_id=?", (event_id,)
              ).fetchone()
              if row and row["status"] == "TRIAGED":
                  print("PASS: patient HTTP check-in -> n8n webhook -> FastAPI triage -> PostgreSQL")
                  break
              time.sleep(2)
          else:
              raise AssertionError("Check-in did not reach TRIAGED through n8n")
          PY
      - name: Prove n8n outage leaves durable queued check-in and recovers after restart
        run: |
          set -euo pipefail
          docker compose stop n8n
          docker compose exec -T api python - <<'PY'
          import os, time, jwt, httpx
          from app.main import app
          key=os.environ["APP_TOKEN_SECRET"]
          ref="CHK-CI-OUTAGE-REPLAY001"
          claims={"iss":"hah-course-demo","sub":"ci-synthetic-patient",
                  "role":"patient","patient_ref":"DEMO-P001",
                  "exp":int(time.time())+600}
          token=jwt.encode(claims,key,algorithm="HS256")
          response=httpx.post(
              "http://127.0.0.1:8000/v2/checkins",
              headers={"Authorization":"Bearer "+token},
              json={"event_id":ref,"patient_ref":"DEMO-P001","is_synthetic":True,
                    "symptoms":{"swelling":True},
                    "patient_note":"Synthetic CI-only temporary orchestration outage"},
              timeout=25,
          )
          assert response.status_code==202,(response.status_code,response.text[:150])
          row=app.state.store.db.execute("SELECT status FROM checkins WHERE event_id=?",(ref,)).fetchone()
          assert row and row["status"]=="PENDING",row
          job=app.state.store.db.execute(
              "SELECT status FROM dispatch_jobs WHERE job_kind=? AND reference_id=?",
              ("CHECKIN_DISPATCH",ref)
          ).fetchone()
          assert job and job["status"]=="PENDING",job
          assert app.state.store.verify_audit() is True
          print("PASS: n8n outage -> API 202 -> durable PENDING check-in and dispatch job")
          PY
          docker compose start n8n
          for attempt in $(seq 1 45); do
            if curl -fsS --max-time 3 http://127.0.0.1:5678/healthz >/dev/null; then break; fi
            sleep 2
          done
          # A healthy n8n process alone doesn't prove published webhooks are ready.
          code=""
          for attempt in $(seq 1 35); do
            code="$(curl -sS -o /tmp/hah_replay_webhook_ready.json -w '%{http_code}' --max-time 5 -X POST \
              -H 'Content-Type: application/json' -d '{"event_id":"CHK-CI-READINESS_REPLAY_ONLY"}' \
              http://127.0.0.1:5678/webhook/hah-checkin-intake || true)"
            if [ "$code" = "200" ] || [ "$code" = "202" ]; then break; fi
            sleep 2
          done
          test "$code" = "200" || test "$code" = "202" || { echo "Restored webhook did not become available" >&2; exit 1; }
          # Invoke the same authenticated drain endpoint used by n8n schedules.
          # Retry is server-side and references the durable queue, not a new check-in.
          docker compose exec -T api python - <<'PY'
          import os, time, httpx
          from app.main import app
          ref="CHK-CI-OUTAGE-REPLAY001"
          with httpx.Client(timeout=30) as client:
              headers={"X-Internal-Key":os.environ["APP_INTERNAL_KEY"]}
              result=client.post("http://127.0.0.1:8000/internal/ops/dispatch-drain",
                                 headers=headers,json={})
              assert result.status_code==200,(result.status_code,result.text[:200])
              for attempt in range(30):
                  row=app.state.store.db.execute(
                      "SELECT status FROM checkins WHERE event_id=?",(ref,)
                  ).fetchone()
                  if row and row["status"]=="TRIAGED": break
                  time.sleep(2)
              else:raise AssertionError("Durable check-in was not triaged after n8n recovery")
              job=app.state.store.db.execute(
                  "SELECT status FROM dispatch_jobs WHERE job_kind=? AND reference_id=?",
                  ("CHECKIN_DISPATCH",ref)
              ).fetchone()
              assert job and job["status"]=="DELIVERED",job
              again=client.post("http://127.0.0.1:8000/internal/ops/dispatch-drain",
                                headers=headers,json={})
              assert again.status_code==200,again.text[:200]
              assert app.state.store.db.execute(
                  "SELECT COUNT(*) AS n FROM checkins WHERE event_id=?",(ref,)
              ).fetchone()["n"]==1
              assert app.state.store.verify_audit() is True
          print("PASS: n8n recovers -> durable queue drain -> PostgreSQL TRIAGED, no duplicate check-in")
          PY
      - name: Seed real fail-closed clinician review using synthetic-only API calls
        run: |
          set -euo pipefail
          # No fake model or direct database patch. The real app returns 503
          # and must create a protected clinician review task.
          docker compose exec -T api python - <<'PY'
          import os
          import time
          import jwt
          import httpx
          key=os.environ["APP_TOKEN_SECRET"]
          def bearer(role):
              claims={"iss":"hah-course-demo","sub":"ci-patient" if role=="patient" else "ci-clinician",
                      "role":role,"exp":int(time.time())+900}
              if role=="patient": claims["patient_ref"]="DEMO-P001"
              return {"Authorization":"Bearer "+jwt.encode(claims,key,algorithm="HS256")}
          case_id="HHC-CASE-CI-REVIEW"
          with httpx.Client(timeout=25) as h:
              r=h.post("http://127.0.0.1:8000/v1/intake",headers=bearer("patient"),
                  json={"case_id":case_id,"patient_ref":"DEMO-P001",
                        "is_synthetic":True,"consent_for_demo_processing":True,
                        "vitals":{},"symptoms":{},
                        "meal_text":"CI synthetic case. No actual patient."})
              assert r.status_code==202,(r.status_code,r.text[:180])
              headers={"X-Internal-Key":os.environ["APP_INTERNAL_KEY"]}
              r=h.post("http://127.0.0.1:8000/internal/start",headers=headers,json={"case_id":case_id})
              assert r.status_code==200,(r.status_code,r.text[:180])
              # Provider credentials deliberately absent; application must fail closed.
              r=h.post("http://127.0.0.1:8000/internal/plan",headers=headers,json={"case_id":case_id})
              assert r.status_code==503,(r.status_code,r.text[:180])
              r=h.get("http://127.0.0.1:8000/v1/cases/"+case_id,headers=bearer("clinician"))
              assert r.status_code==200,(r.status_code,r.text[:180])
              assert r.json()["status"]=="TECHNICAL_REVIEW",r.json()["status"]
          print("PASS: true AI-unavailable fail-closed API -> clinical review task")
          PY
      - name: Set up Node and cache locked browser dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Run real Chromium browser clinician-patient message loop
        run: |
          set -euo pipefail
          # The tokens only exist for this short-lived synthetic-only runner.
          docker compose exec -T api python - <<'PY' > /tmp/hah_browser_tokens.json
          import json
          import os
          import time
          import jwt
          secret=os.environ["APP_TOKEN_SECRET"]
          base={"iss":"hah-course-demo","exp":int(time.time())+900}
          clinician=jwt.encode({**base,"sub":"ci-clinician","role":"clinician"},secret,algorithm="HS256")
          patient=jwt.encode({**base,"sub":"ci-patient","role":"patient","patient_ref":"DEMO-P001"},secret,algorithm="HS256")
          print(json.dumps({"clinician":clinician,"patient":patient}))
          PY
          chmod 600 /tmp/hah_browser_tokens.json
          npm ci --prefix tests/browser --no-audit --no-fund
          ./tests/browser/node_modules/.bin/playwright install --with-deps chromium
          HAH_BROWSER_TOKENS_PATH=/tmp/hah_browser_tokens.json \
            node tests/browser/closed_loop.mjs
      - name: Prove acknowledged communication and audit persist through database restart
        run: |
          set -euo pipefail
          docker compose exec -T api python - <<'PY'
          from app.main import app
          row=app.state.store.db.execute(
              "SELECT state FROM in_app_communications WHERE patient_ref=? ORDER BY created_at DESC LIMIT 1",
              ("DEMO-P001",)
          ).fetchone()
          assert row and row["state"]=="ACKNOWLEDGED", row
          assert app.state.store.verify_audit() is True
          print("Before restart: ACKNOWLEDGED communication and intact audit chain")
          PY
          docker compose restart postgres
          for i in $(seq 1 45); do
            if docker compose exec -T postgres pg_isready -U hah_demo -d hah_demo >/dev/null; then break; fi
            sleep 2
          done
          docker compose restart api
          for i in $(seq 1 60); do
            if curl -fsS --max-time 3 http://127.0.0.1:8000/health >/tmp/hah_after_restart.json; then break; fi
            sleep 2
          done
          docker compose exec -T api python - <<'PY'
          from app.main import app
          row=app.state.store.db.execute(
              "SELECT state FROM in_app_communications WHERE patient_ref=? ORDER BY created_at DESC LIMIT 1",
              ("DEMO-P001",)
          ).fetchone()
          assert row and row["state"]=="ACKNOWLEDGED", row
          assert app.state.store.verify_audit() is True
          print("PASS: durable ACKNOWLEDGED message and HMAC audit after PostgreSQL/API restart")
          PY
      - name: Back up and restore encrypted synthetic PostgreSQL data
        run: |
          set -euo pipefail
          docker compose exec -T postgres pg_dump -U hah_demo --format=custom hah_demo > /tmp/hah_synthetic_restore_ci.dump
          test -s /tmp/hah_synthetic_restore_ci.dump
          docker compose exec -T postgres createdb -U hah_demo hah_restore_ci
          docker compose exec -T postgres pg_restore -U hah_demo --no-owner --no-privileges \
            --dbname=hah_restore_ci < /tmp/hah_synthetic_restore_ci.dump
          previous="$(docker compose exec -T postgres psql -U hah_demo -d hah_demo -Atc \
            "SELECT COUNT(*) FROM in_app_communications WHERE state='ACKNOWLEDGED'" | tr -d '\r\n')"
          restored="$(docker compose exec -T postgres psql -U hah_demo -d hah_restore_ci -Atc \
            "SELECT COUNT(*) FROM in_app_communications WHERE state='ACKNOWLEDGED'" | tr -d '\r\n')"
          test "$previous" -ge 1
          test "$restored" = "$previous"
          before="$(docker compose exec -T postgres psql -U hah_demo -d hah_demo -Atc \
            "SELECT hash FROM audit ORDER BY seq DESC LIMIT 1" | tr -d '\r\n')"
          after="$(docker compose exec -T postgres psql -U hah_demo -d hah_restore_ci -Atc \
            "SELECT hash FROM audit ORDER BY seq DESC LIMIT 1" | tr -d '\r\n')"
          test -n "$before"
          test "$before" = "$after"
          docker compose exec -T postgres dropdb -U hah_demo hah_restore_ci
          rm -f /tmp/hah_synthetic_restore_ci.dump
          echo "PASS: PostgreSQL pg_dump/pg_restore preserves synthetic patient receipts and audit hashes"
      - name: Preserve successful synthetic clinician and patient UI screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hah-synthetic-portfolio-ui
          path: |
            tests/browser/artifacts/clinician-synthetic-success.png
            tests/browser/artifacts/patient-synthetic-success.png
          if-no-files-found: error
          retention-days: 14
      - name: Collect browser screenshots on failure only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-browser-failure
          path: tests/browser/artifacts/
          if-no-files-found: ignore
          retention-days: 3
      - name: Diagnose failed services and remove disposable data
        if: always()
        run: |
          docker compose ps || true
          docker compose logs --tail=100 --no-color api postgres n8n frontend || true
          docker compose down --volumes --remove-orphans || true
          rm -f .env
